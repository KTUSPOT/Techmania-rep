<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-opacity="0.2" />

  <!-- Graduation Cap Icon -->
  <g transform="translate(106, 120)">
    <!-- Cap Diamond Top -->
    <polygon points="150,20 290,95 150,170 10,95" fill="url(#accent-grad)" />
    <!-- Cap Underneath -->
    <path d="M 60,130 L 60,200 Q 150,250 240,200 L 240,130 Q 150,180 60,130 Z" fill="#4338ca" />
    <!-- Tassel -->
    <path d="M 270,105 Q 285,150 290,195" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" />
    <circle cx="290" cy="205" r="9" fill="#fbbf24" />
  </g>

  <!-- KTU Badge -->
  <rect x="156" y="375" width="200" height="56" rx="28" fill="url(#badge-grad)" />
  <text x="256" y="413" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4">KTU APP</text>
</svg>
